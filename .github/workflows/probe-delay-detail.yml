name: Probe delay detail extraction

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: JR East - kanto.aspx status page
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sS -A "$UA" -H "Accept-Language: ja,en;q=0.8" -H "Referer: https://www.jreast.co.jp/" \
            -o /tmp/jreast.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" \
            "https://traininfo.jreast.co.jp/train_info/kanto.aspx" || true
          echo "--- look for script/xhr/json/api references ---"
          grep -oE '(src|href)="[^"]*\.(js|json)[^"]*"' /tmp/jreast.html | sort -u | head -30 || true
          grep -oE '(fetch|ajax|XMLHttpRequest|url:)[^;]{0,120}' /tmp/jreast.html | head -20 || true
          echo "--- 中央/湘南新宿 mentions ---"
          grep -o '.\{80\}中央.\{80\}' /tmp/jreast.html | head -5 || true
          grep -o '.\{80\}湘南新宿.\{80\}' /tmp/jreast.html | head -5 || true
          echo "--- first 2000 chars ---"
          head -c 2000 /tmp/jreast.html || true

      - name: TWR - homepage links to operation status page
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sS -A "$UA" -o /tmp/twr.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" "https://www.twr.co.jp/" || true
          echo "--- all internal links ---"
          grep -oE 'href="[^"]+"' /tmp/twr.html | sort -u | head -60 || true

      - name: Keio Bus - homepage links to operation status page
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sS -A "$UA" -o /tmp/keio.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" "https://www.keio-bus.com/" || true
          echo "--- all internal links ---"
          grep -oE 'href="[^"]+"' /tmp/keio.html | sort -u | head -60 || true
